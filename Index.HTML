<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Caleb Jordan - About Me</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background-color: lightblue;
      font-family: sans-serif;
      text-align: center;
    }

    h1, h2 {
      margin: 20px 0;
    }

   
    .button-container {
      display: flex;
      justify-content: space-between;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .btn {
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      flex: 1;
      margin: 0 10px;
      text-align: center;
    }

    .btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h1>Caleb Jordan</h1>

  <h2>About Me</h2>

  <img src="Mountian.jpg" alt="Profile Picture" class="profile-pic">

  <div class="button-container">
    <a href="About Me.HTML" class="btn">About Me</a>
    <a href="My Hobbies.html" class="btn">My Hobbies</a>
    <a href="Fun Facts.HTML" class="btn">Fun Facts</a>
	
  </div>

</body>
</html>
